services:
  bot:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Start in dry-run so a first run analyses without posting anything.
      DRY_RUN: ${DRY_RUN:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
